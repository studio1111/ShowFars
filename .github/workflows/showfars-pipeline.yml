name: ShowFars Movie Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "showfars/**"
      - "tests/**"
      - "config.json"
      - "data/movies.json"
      - ".github/workflows/showfars-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: showfars-movie-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python
        run: |
          python -m compileall -q app.py showfars tests
          python -m unittest discover -s tests -v
      - name: Process authorized movie queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOWFARS_DRY_RUN: ${{ vars.SHOWFARS_DRY_RUN || 'true' }}
        run: python app.py
      - name: Persist publication state
        if: always()
        run: |
          if ! git diff --quiet -- data/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: persist ShowFars publication state [skip ci]"
            git push
          fi
